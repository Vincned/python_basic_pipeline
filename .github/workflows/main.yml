name: CI Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
    # 1. Скачиваем код из репозитория
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Настраиваем Python и прогоняем тесты
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies & Run Tests
      working-directory: ./python_code
      run: |
        pip install pytest
        pytest test_main.py

    # 3. Собираем Docker-образ, чтобы убедиться, что Dockerfile корректен
    - name: Build Docker Image
      run: |
        docker build -t my-app:latest .